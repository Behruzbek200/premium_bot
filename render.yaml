services:
  - type: web
    name: premium-market-uz
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /health
    disk:
      name: premium-market-db
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DB_PATH
        value: /var/data/market.sqlite3
      - key: PERSISTENT_DB_REQUIRED
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: FRAGMENT_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
